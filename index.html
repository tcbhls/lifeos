<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8f7" media="(prefers-color-scheme: light)" />
    <title>LifeOS · 极简隐私优先健身与养生助手</title>
    <!-- 首屏同步恢复上次主题与背景底色，彻底避免进入 App 时闪白/闪黑 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lifeos_theme_cache') || 'dark';
          var isDark =
            saved === 'dark' ||
            (saved === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.backgroundColor = isDark ? '#0b0c0e' : '#f7f8f7';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
